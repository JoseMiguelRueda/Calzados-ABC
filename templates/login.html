{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <h5 class="mb-0">Importadora de Calzados ABC</h5>
                <small>Acceso al Sistema (HU-01)</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Usuario / Login</label>
                        <input type="text" name="login" class="form-control" placeholder="admin@abc.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                </form>
                <!--<div class="mt-3 text-muted small text-center">
                    Demo Admin: <code>admin@abc.com</code> / <code>admin123</code>
                </div>
            -->
            </div>
        </div>
    </div>
</div>
{% endblock %}
