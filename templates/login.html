{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <h5 class="mb-0">Calzados ABC - Inicio de Sesión (HU-01)</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Correo / Usuario</label>
                        <input type="text" name="login" class="form-control" placeholder="admin@abc.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
                <hr>
                <small class="text-muted">Demo Admin: <code>admin@abc.com</code> / <code>admin123</code></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
